name: Release

# Pushing a tag like v0.3.0 builds the Windows, macOS and Linux installers and the Firefox add-on
# and publishes them as a GitHub release. Run by hand, it only builds them (a dry run, nothing published).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # x64 .exe
            files: apps/desktop/release/*.exe
          - os: macos-15 # Apple Silicon .dmg
            files: apps/desktop/release/*.dmg
          - os: macos-15-intel # Intel .dmg
            files: apps/desktop/release/*.dmg
          - os: ubuntu-latest # x64 .deb and AppImage
            files: |
              apps/desktop/release/*.deb
              apps/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Linux: BtbN's ffmpeg, which uses the system's glibc (ffmpeg-static's crashes there); the unit tests use it too
      - name: Linux ffmpeg
        if: runner.os == 'Linux'
        run: node apps/desktop/scripts/fetch-ffmpeg-linux.mjs
      - name: Unit tests
        run: pnpm test
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python client tests
        run: pnpm test:python
        continue-on-error: true
      - run: pnpm build
      # macOS: signed with the Developer ID certificate and notarized by Apple when the secrets are set (ad hoc otherwise)
      - name: Apple's notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Build the installer
        run: pnpm --filter @turbodl/desktop exec electron-builder --config electron-builder.config.cjs --publish never
        env:
          # electron-builder signs only with discovery on: on for macOS with the certificate, off elsewhere
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 != '' && 'true' || 'false' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
      # Linux: the .deb's contents, and the AppImage's Node mode, bridge and api.json (no e2e on any platform here)
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          xvfb-run -a pnpm --filter @turbodl/desktop smoke:packaged
      - name: Check the Mac app's signature, notarization and Gatekeeper
        if: runner.os == 'macOS' && env.APPLE_API_KEY != ''
        run: |
          app="$(ls -d apps/desktop/release/mac*/TurboDL.app | head -1)"
          codesign --verify --deep --strict --verbose=1 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @turbodl/extension build
      # Signed by Mozilla when the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets are set (needed by regular Firefox);
      # otherwise unsigned, which only Firefox Developer Edition, Nightly and ESR can install.
      - name: Package the Firefox add-on
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir -p firefox-out
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            npx --yes web-ext@10.7.0 sign --source-dir apps/extension/dist-firefox --artifacts-dir firefox-out --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          else
            npx --yes web-ext@10.7.0 build --source-dir apps/extension/dist-firefox --artifacts-dir firefox-out
          fi
          mv firefox-out/*.* "firefox-out/TurboDL-Firefox-${GITHUB_REF_NAME#v}.xpi"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-firefox
          path: firefox-out/*.xpi
          if-no-files-found: error

  release:
    needs: [build, firefox]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: TurboDL ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: installers/*
