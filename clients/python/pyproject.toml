[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodl-client"
version = "0.1.0"
description = "Python client for the TurboDL download manager's local API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.setuptools]
packages = ["turbodl_client"]
